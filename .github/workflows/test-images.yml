# Build the provisioned XWiki test images and publish them to GHCR, so that integration runs and
# agents pull them instead of spending ~10 minutes building each one. An image is only pushed once
# the baseline tests (tests/integration/00-env.bats) pass on it. See docs/test-env.md.
#
# A push that changes the test environment builds and checks every image, on any branch, but only
# the default branch, the schedule and manual runs publish them: a feature branch never replaces
# the published images.
name: Test images
on:
  workflow_dispatch:
    inputs:
      variants:
        description: 'Space-separated variants (default: every variant in tests/env/variants)'
        required: false
  schedule:
    - cron: '41 3 * * 0'
  push:
    paths:
      - 'tests/env/**'
      - '.github/workflows/test-images.yml'
permissions:
  contents: read
  packages: write
jobs:
  variants:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          VARIANTS: ${{ inputs.variants }}
        run: |
          v="${VARIANTS:-$(grep -v '^#' tests/env/variants)}"
          echo "list=$(printf '%s\n' $v | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  build:
    needs: variants
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: tests/env/xwiki-env.sh build "$VARIANT"
      - name: Check the image (baseline tests)
        env:
          VARIANT: ${{ matrix.variant }}
        run: tests/run.sh --suite integration --variant "$VARIANT" --no-build --filter '^env:' --out results
      - name: Log in to GHCR
        if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          export XINIT_TEST_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tests/env/xwiki-env.sh push "$VARIANT"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-image-${{ matrix.variant }}
          path: results
