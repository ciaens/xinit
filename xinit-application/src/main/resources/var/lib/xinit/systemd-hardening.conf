
# Filesystem hardening
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
PrivateDevices=yes
ProtectProc=invisible
ProcSubset=pid

# Hide sensitive paths (not needed by XWiki/Java/LibreOffice)
InaccessiblePaths=/root /boot /media /mnt /srv

# Whitelist /etc — overlay with empty tmpfs, then bind-mount only what's needed.
# NOTE: /etc/passwd and /etc/group are intentionally NOT bind-mounted, so the
# service cannot read host user accounts. This may produce harmless getpwuid()
# warnings at JVM startup but does not affect functionality.
# NOTE: Java/alternatives paths below use Debian/Ubuntu naming; if you port to
# RPM-based distros, add /etc/java/ and /usr/lib/jvm-exports paths.
TemporaryFileSystem=/etc:ro
BindReadOnlyPaths=/etc/xwiki
BindReadOnlyPaths=/etc/resolv.conf /etc/hosts /etc/nsswitch.conf /etc/hostname
BindReadOnlyPaths=/etc/localtime -/etc/timezone
BindReadOnlyPaths=-/etc/ssl/certs -/etc/ca-certificates
BindReadOnlyPaths=-/etc/java-11-openjdk -/etc/java-17-openjdk -/etc/java-21-openjdk -/etc/java-23-openjdk -/etc/java-25-openjdk
BindReadOnlyPaths=-/etc/alternatives -/etc/default/java
BindReadOnlyPaths=-/etc/ld.so.cache
BindReadOnlyPaths=-/etc/fonts -/etc/libreoffice
BindReadOnlyPaths=-/etc/tomcat11 -/etc/tomcat10 -/etc/tomcat9
BindReadOnlyPaths=-/etc/default/tomcat11 -/etc/default/tomcat10 -/etc/default/tomcat9

# Capabilities — drop everything. XWiki runs as non-root on port 8080,
# so it needs no capabilities at all.
CapabilityBoundingSet=
AmbientCapabilities=

# Namespace / privilege restrictions
NoNewPrivileges=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RemoveIPC=yes
PrivateIPC=yes
KeyringMode=private

# Network — allow only what's needed
# XWiki needs AF_INET/AF_INET6 (HTTP, DB) and AF_UNIX (local sockets/LibreOffice)
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
# NOTE: Do NOT enable PrivateNetwork=yes —> needs network access

# System call filtering
SystemCallArchitectures=native
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
# NOTE: Not filtering @privileged and @resources as Java/LibreOffice may need some of those

# Memory / misc
# MemoryDenyWriteExecute=yes INTENTIONALLY COMMENTED OUT —> Java JIT needs W^X
UMask=0077
PrivateUsers=yes

# Device access — PrivateDevices=yes (above) already provides /dev/null,
# /dev/zero, /dev/full, /dev/random, /dev/urandom, /dev/tty, /dev/ptmx,
# which is everything XWiki/Java/LibreOffice need. No extra DeviceAllow= entries.
