
# Filesystem hardening
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
PrivateDevices=yes
ProtectProc=invisible
ProcSubset=pid

# Hide sensitive paths (not needed by XWiki/Java/LibreOffice)
InaccessiblePaths=/root /boot /media /mnt /etc/shadow /etc/gshadow /etc/sudoers /etc/ssh /etc/passwd

# Capabilities
CapabilityBoundingSet=
# Empty = drop ALL capabilities. XWiki runs as non-root user
# on port 8080, so it needs no capabilities at all.

# Namespace / privilege restrictions
NoNewPrivileges=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RemoveIPC=yes
PrivateIPC=yes

# Network — allow only what's needed
# XWiki needs AF_INET/AF_INET6 (HTTP, DB) and AF_UNIX (local sockets/LibreOffice)
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
# NOTE: Do NOT enable PrivateNetwork=yes —> needs network access

# System call filtering
SystemCallArchitectures=native
SystemCallFilter=~@clock @cpu-emulation @debug @module @mount @obsolete @raw-io @reboot @swap
# NOTE: Not filtering @privileged and @resources as Java/LibreOffice may need some of those

# Memory / misc
# MemoryDenyWriteExecute=yes INTENTIONALLY COMMENTED OUT —> Java JIT needs W^X
UMask=0077
PrivateUsers=yes

# Device access — only what's strictly needed
DeviceAllow=/dev/null rw
DeviceAllow=/dev/urandom r
DeviceAllow=/dev/zero r
